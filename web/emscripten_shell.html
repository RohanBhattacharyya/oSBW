<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenStarbound (Web)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0f14;
      color: #e5e7eb;
    }
    #topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #101010;
      border-bottom: 1px solid #1f2937;
    }
    #status {
      margin-left: auto;
      font-size: 12px;
      opacity: 0.8;
    }
    #canvas {
      width: 100vw;
      height: calc(100vh - 56px);
      display: block;
      background: #000;
    }
    .btn {
      background: #2563eb;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    input[type="file"] {
      color: #e5e7eb;
    }
    body.fullscreen #topbar,
    body.fullscreen #modsPane,
    body.fullscreen #saveDataPane,
    body.fullscreen #uploadProgress {
      display: none !important;
    }
    body.fullscreen #canvas {
      height: 100vh;
    }
    #fullscreenBtn {
      background: #374151;
    }
    #fullscreenBtn:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <strong>OpenStarbound Web</strong>
    <label style="display:flex; flex-direction:column; gap:4px; font-size:12px;">
      <span style="opacity:0.8;">Base assets (packed.pak)</span>
      <input id="pakInput" type="file" accept=".pak" />
    </label>
    <label style="display:flex; flex-direction:column; gap:4px; font-size:12px;">
      <span style="opacity:0.8;">Add mod .pak(s)</span>
      <input id="modPakInput" type="file" accept=".pak" multiple />
    </label>
    <label style="display:flex; flex-direction:column; gap:4px; font-size:12px;">
      <span style="opacity:0.8;">Add mod folder</span>
      <input id="modDirInput" type="file" webkitdirectory multiple />
    </label>
    <button id="startBtn" class="btn" disabled>Start</button>
    <button id="fullscreenBtn" class="btn" title="Toggle fullscreen (hides UI)">⛶ Fullscreen</button>
    <div id="status">Waiting for runtime...</div>
  </div>
  <div id="modsPane" style="padding: 10px 16px; border-bottom: 1px solid #1f2937; background:#0b0f14;">
    <div style="display:flex; gap: 12px; align-items:center;">
      <strong style="font-size: 13px;">Installed mods</strong>
      <button id="refreshModsBtn" class="btn" style="background:#374151;">Refresh</button>
      <button id="clearModsBtn" class="btn" style="background:#b91c1c;">Delete all</button>
      <span style="margin-left:auto; font-size: 12px; opacity:0.8;">Mods live in <code>/mods</code> (persistent)</span>
    </div>
    <div id="modsList" style="margin-top: 10px; display:flex; flex-direction:column; gap:6px;"><div style="opacity:0.8; font-style:italic;">Loading mods...</div></div>
    <div style="margin-top: 6px; font-size:12px; opacity:0.7; line-height:1.4;">
      Load order is determined by mod metadata (<code>priority</code>, <code>requires</code>, <code>includes</code>) and name sorting.
    </div>
  </div>
  <div id="saveDataPane" style="padding: 10px 16px; border-bottom: 1px solid #1f2937; background:#0b0f14;">
    <div style="display:flex; gap: 12px; align-items:center; flex-wrap: wrap;">
      <strong style="font-size: 13px;">Save Data</strong>
      <button id="exportSaveBtn" class="btn" style="background:#059669;">Export All</button>
      <label class="btn" style="background:#7c3aed; cursor:pointer;">
        Import
        <input id="importSaveInput" type="file" accept=".zip" style="display:none;" />
      </label>
      <span style="margin-left:auto; font-size: 12px; opacity:0.8;">Export/import saves &amp; mods as a .zip file</span>
    </div>
  </div>
  <progress id="uploadProgress" value="0" max="1" style="width: 100%; height: 6px; display: none;"></progress>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>

  <script>
    function setStatus(text) {
      const el = document.getElementById('status');
      if (el) el.textContent = text;
    }

    function resizeCanvasToDisplaySize() {
      const canvas = document.getElementById('canvas');
      if (!canvas)
        return;
      const ratio = window.devicePixelRatio || 1;
      const cssWidth = canvas.clientWidth || window.innerWidth;
      const cssHeight = canvas.clientHeight || (window.innerHeight - 56);
      const width = Math.max(1, Math.floor(cssWidth * ratio));
      const height = Math.max(1, Math.floor(cssHeight * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        if (typeof Module !== 'undefined' && typeof Module.setCanvasSize === 'function')
          Module.setCanvasSize(width, height, true);
      }
    }

    function getFs() {
      return Module.FS || Module['FS'] || (typeof FS !== 'undefined' ? FS : null);
    }

    function getIdbfs() {
      const fs = getFs();
      if (fs && fs.filesystems && fs.filesystems.IDBFS)
        return fs.filesystems.IDBFS;
      return null;
    }

    function getWorkerFs() {
      const fs = getFs();
      if (fs && fs.filesystems && fs.filesystems.WORKERFS)
        return fs.filesystems.WORKERFS;
      return null;
    }

    function isPersistentPath(path) {
      return typeof path === 'string' && (
        path === '/storage' || path.startsWith('/storage/') ||
        path === '/mods' || path.startsWith('/mods/')
      );
    }

    let fsSyncInstalled = false;
    let fsSyncTimer = null;
    let fsSyncInProgress = false;
    let fsSyncPending = false;
    let fsSyncInterval = null;

    function forceSyncNow(reason) {
      const fs = getFs();
      const idbfs = getIdbfs();
      if (!fs || !idbfs)
        return;
      if (fsSyncInProgress) {
        fsSyncPending = true;
        return;
      }
      fsSyncInProgress = true;
      fsSyncPending = false;
      fs.syncfs(false, (err) => {
        fsSyncInProgress = false;
        if (err) {
          console.warn('[Web] Save sync failed:', err);
        }
        if (fsSyncPending)
          forceSyncNow('coalesced');
      });
    }

    function scheduleSync(reason) {
      const fs = getFs();
      const idbfs = getIdbfs();
      if (!fs || !idbfs)
        return;
      fsSyncPending = true;
      if (fsSyncTimer)
        return;
      fsSyncTimer = setTimeout(() => {
        fsSyncTimer = null;
        forceSyncNow(reason || 'debounced');
      }, 1000);
    }

    function installFsSyncHooks() {
      if (fsSyncInstalled)
        return;
      const fs = getFs();
      if (!fs)
        return;

      fsSyncInstalled = true;

      const origWriteFile = fs.writeFile.bind(fs);
      fs.writeFile = function(path, data, opts) {
        const result = origWriteFile(path, data, opts);
        if (isPersistentPath(path))
          scheduleSync('writeFile');
        return result;
      };

      const origClose = fs.close.bind(fs);
      fs.close = function(stream) {
        const result = origClose(stream);
        if (stream && isPersistentPath(stream.path))
          scheduleSync('close');
        return result;
      };

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden')
          forceSyncNow('visibility');
      });
      window.addEventListener('pagehide', () => forceSyncNow('pagehide'));
      window.addEventListener('beforeunload', () => forceSyncNow('beforeunload'));

      if (!fsSyncInterval) {
        fsSyncInterval = setInterval(() => forceSyncNow('interval'), 15000);
      }

      setTimeout(() => forceSyncNow('startup'), 5000);
    }

    function setUploadProgress(frac) {
      const p = document.getElementById('uploadProgress');
      if (!p)
        return;
      if (typeof frac !== 'number' || !isFinite(frac))
        frac = 0;
      p.value = Math.max(0, Math.min(1, frac));
      p.style.display = 'block';
    }

    function hideUploadProgress() {
      const p = document.getElementById('uploadProgress');
      if (!p)
        return;
      p.style.display = 'none';
      p.value = 0;
    }

    function formatBytes(bytes) {
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
      }
      const digits = unit === 0 ? 0 : (unit <= 2 ? 1 : 2);
      return `${value.toFixed(digits)} ${units[unit]}`;
    }

    function waitForFsAvailable(timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const start = performance.now();
        const tick = () => {
          const fs = getFs();
          if (fs)
            return resolve(fs);
          if (performance.now() - start > timeoutMs)
            return reject(new Error('Filesystem not ready yet. Please wait for runtime initialization.'));
          requestAnimationFrame(tick);
        };
        tick();
      });
    }

    async function ensureFsReady() {
      const fs = await waitForFsAvailable();
      const idbfs = getIdbfs();

      if (!fs.analyzePath('/uploads').exists)
        fs.mkdir('/uploads');
      if (!fs.analyzePath('/storage').exists)
        fs.mkdir('/storage');
      if (!fs.analyzePath('/mods').exists)
        fs.mkdir('/mods');
      if (!fs.analyzePath('/overrides').exists)
        fs.mkdir('/overrides');

      if (idbfs) {
        // Mount persistent storage.
        try {
          fs.mount(idbfs, {}, '/storage');
        } catch (err) {
          if (!(err && (err.errno === 10 || String(err).includes('EBUSY'))))
            throw err;
        }

        // Mount persistent mods at /mods so it matches desktop layout.
        try {
          fs.mount(idbfs, {}, '/mods');
        } catch (err) {
          if (!(err && (err.errno === 10 || String(err).includes('EBUSY'))))
            throw err;
        }
        return new Promise((resolve, reject) => {
          fs.syncfs(true, (err) => err ? reject(err) : resolve());
        });
      } else {
        console.warn('[Web] IDBFS is not available; saves will not persist.');
        setStatus('Warning: Persistent saves unavailable (IDBFS missing)');
      }
    }

    function ensureDir(path) {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      const parts = path.split('/').filter(Boolean);
      let current = '';
      for (const p of parts) {
        current += '/' + p;
        if (!fs.analyzePath(current).exists)
          fs.mkdir(current);
      }
    }

    async function writeFileFromBlob(destPath, blob, progressCb) {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      ensureDir(destPath.split('/').slice(0, -1).join('/') || '/');

      const size = typeof blob.size === 'number' ? blob.size : 0;
      const chunkSize = 4 * 1024 * 1024;
      let written = 0;
      const fd = fs.open(destPath, 'w+');
      try {
        while (written < size) {
          const end = Math.min(written + chunkSize, size);
          const buf = new Uint8Array(await blob.slice(written, end).arrayBuffer());
          fs.write(fd, buf, 0, buf.length, written);
          written = end;
          if (progressCb)
            progressCb(written, size);
          await new Promise((resolve) => setTimeout(resolve, 0));
        }
      } finally {
        fs.close(fd);
      }
    }

    function listModsInFs() {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      if (!fs.analyzePath('/mods').exists)
        return [];
      return fs.readdir('/mods')
        .filter((n) => n !== '.' && n !== '..')
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    function removeTree(path) {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      const stat = fs.stat(path);
      if (fs.isDir(stat.mode)) {
        for (const name of fs.readdir(path)) {
          if (name === '.' || name === '..')
            continue;
          removeTree(path + '/' + name);
        }
        fs.rmdir(path);
      } else {
        fs.unlink(path);
      }
    }

    function renderModsList() {
      const listEl = document.getElementById('modsList');
      if (!listEl)
        return;
      listEl.innerHTML = '';

      let mods = [];
      try {
        mods = listModsInFs();
      } catch (err) {
        const row = document.createElement('div');
        row.textContent = 'Mods unavailable until filesystem is ready.';
        row.style.opacity = '0.8';
        listEl.appendChild(row);
        return;
      }

      if (mods.length === 0) {
        const row = document.createElement('div');
        row.textContent = 'No mods installed.';
        row.style.opacity = '0.8';
        listEl.appendChild(row);
        return;
      }

      for (const name of mods) {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.alignItems = 'center';
        row.style.gap = '10px';
        row.style.padding = '6px 8px';
        row.style.border = '1px solid #1f2937';
        row.style.borderRadius = '8px';

        const label = document.createElement('div');
        label.textContent = name;
        label.style.flex = '1';
        label.style.fontSize = '13px';

        const del = document.createElement('button');
        del.className = 'btn';
        del.textContent = 'Delete';
        del.style.background = '#b91c1c';
        del.addEventListener('click', () => {
          if (!confirm(`Delete mod '${name}' from /mods?`))
            return;
          try {
            removeTree('/mods/' + name);
            scheduleSync('deleteMod');
            renderModsList();
          } catch (err) {
            console.error(err);
            alert('Failed to delete: ' + err);
          }
        });

        row.appendChild(label);
        row.appendChild(del);
        listEl.appendChild(row);
      }
    }

    // Recursively collect all files from a directory into a flat list
    function collectFilesRecursive(basePath, relativePath = '') {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      const files = [];
      const fullPath = basePath + (relativePath ? '/' + relativePath : '');
      
      if (!fs.analyzePath(fullPath).exists)
        return files;
      
      const entries = fs.readdir(fullPath);
      for (const name of entries) {
        if (name === '.' || name === '..')
          continue;
        const entryRelPath = relativePath ? relativePath + '/' + name : name;
        const entryFullPath = basePath + '/' + entryRelPath;
        const stat = fs.stat(entryFullPath);
        
        if (fs.isDir(stat.mode)) {
          files.push(...collectFilesRecursive(basePath, entryRelPath));
        } else {
          files.push({
            relativePath: entryRelPath,
            fullPath: entryFullPath,
            size: stat.size
          });
        }
      }
      return files;
    }

    async function exportSaveData() {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      
      if (typeof JSZip === 'undefined')
        throw new Error('JSZip library not loaded.');
      
      const zip = new JSZip();
      
      // Collect files from /storage and /mods
      const storageFiles = collectFilesRecursive('/storage');
      const modsFiles = collectFilesRecursive('/mods');
      
      const totalFiles = storageFiles.length + modsFiles.length;
      if (totalFiles === 0) {
        throw new Error('No save data or mods to export.');
      }
      
      let processed = 0;
      
      // Add storage files
      for (const file of storageFiles) {
        const data = fs.readFile(file.fullPath);
        zip.file('storage/' + file.relativePath, data);
        processed++;
        setUploadProgress(processed / totalFiles);
        setStatus(`Packing save data: ${processed}/${totalFiles} files...`);
        await new Promise(r => setTimeout(r, 0)); // Yield to UI
      }
      
      // Add mods files
      for (const file of modsFiles) {
        const data = fs.readFile(file.fullPath);
        zip.file('mods/' + file.relativePath, data);
        processed++;
        setUploadProgress(processed / totalFiles);
        setStatus(`Packing mods: ${processed}/${totalFiles} files...`);
        await new Promise(r => setTimeout(r, 0)); // Yield to UI
      }
      
      setStatus('Compressing archive...');
      const blob = await zip.generateAsync({ 
        type: 'blob',
        compression: 'DEFLATE',
        compressionOptions: { level: 6 }
      }, (metadata) => {
        setUploadProgress(metadata.percent / 100);
      });
      
      // Generate filename with timestamp
      const now = new Date();
      const timestamp = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
      const filename = `openstarbound-save-${timestamp}.zip`;
      
      // Trigger download
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      hideUploadProgress();
      setStatus(`Exported ${totalFiles} files (${formatBytes(blob.size)})`);
    }

    async function importSaveData(file) {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      
      if (typeof JSZip === 'undefined')
        throw new Error('JSZip library not loaded.');
      
      setStatus('Reading archive...');
      const zip = await JSZip.loadAsync(file);
      
      const entries = [];
      zip.forEach((relativePath, zipEntry) => {
        if (!zipEntry.dir) {
          entries.push({ relativePath, zipEntry });
        }
      });
      
      if (entries.length === 0) {
        throw new Error('Archive is empty or contains no files.');
      }
      
      // Validate that archive contains expected structure
      const hasStorage = entries.some(e => e.relativePath.startsWith('storage/'));
      const hasMods = entries.some(e => e.relativePath.startsWith('mods/'));
      
      if (!hasStorage && !hasMods) {
        throw new Error('Archive does not contain storage/ or mods/ directories. Invalid save file.');
      }
      
      // Confirm import
      const storageCount = entries.filter(e => e.relativePath.startsWith('storage/')).length;
      const modsCount = entries.filter(e => e.relativePath.startsWith('mods/')).length;
      const msg = `Import ${storageCount} save files and ${modsCount} mod files?\n\nThis will REPLACE existing save data and mods.`;
      if (!confirm(msg))
        return;
      
      // Clear existing data
      setStatus('Clearing existing data...');
      if (fs.analyzePath('/storage').exists) {
        for (const name of fs.readdir('/storage')) {
          if (name !== '.' && name !== '..')
            removeTree('/storage/' + name);
        }
      }
      if (fs.analyzePath('/mods').exists) {
        for (const name of fs.readdir('/mods')) {
          if (name !== '.' && name !== '..')
            removeTree('/mods/' + name);
        }
      }
      
      // Extract files
      let processed = 0;
      for (const { relativePath, zipEntry } of entries) {
        const destPath = '/' + relativePath;
        const data = await zipEntry.async('uint8array');
        
        // Ensure parent directories exist
        ensureDir(destPath.split('/').slice(0, -1).join('/') || '/');
        
        fs.writeFile(destPath, data);
        processed++;
        setUploadProgress(processed / entries.length);
        setStatus(`Extracting: ${processed}/${entries.length} files...`);
        await new Promise(r => setTimeout(r, 0)); // Yield to UI
      }
      
      // Sync to IndexedDB
      scheduleSync('importSave');
      hideUploadProgress();
      renderModsList();
      setStatus(`Imported ${processed} files. Syncing to storage...`);
      
      // Force sync and wait a bit
      forceSyncNow('import');
      await new Promise(r => setTimeout(r, 1500));
      setStatus('Import complete. Refresh page to use new save data.');
    }

    async function ensurePreloadConfig() {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      const targetPath = '/overrides/preload.config';
      if (fs.analyzePath(targetPath).exists)
        return;

      try {
        const resp = await fetch('preload.config', { cache: 'no-store' });
        if (!resp.ok)
          throw new Error(`HTTP ${resp.status}`);
        const text = await resp.text();
        fs.writeFile(targetPath, text);
        console.info('[Web] Wrote preload.config to /overrides');
      } catch (err) {
        console.warn('[Web] Failed to fetch preload.config, using minimal default', err);
        const fallback = JSON.stringify([
          { type: "json", path: "/player.config:inventoryFilters" }
        ], null, 2);
        fs.writeFile(targetPath, fallback);
      }
    }

    function canUseWorkerFs() {
      return !!getWorkerFs();
    }

    function isUploadsMounted() {
      const fs = getFs();
      if (!fs || !fs.mounts)
        return false;
      return fs.mounts.some((m) => m.mountpoint === '/uploads');
    }

    function unmountUploadsIfNeeded() {
      const fs = getFs();
      if (!fs || !fs.unmount)
        return;
      if (isUploadsMounted()) {
        try {
          fs.unmount('/uploads');
        } catch (err) {
          console.warn('[Web] Failed to unmount /uploads:', err);
        }
      }
    }

    function mountPakWorkerFs(file) {
      const fs = getFs();
      const workerFs = getWorkerFs();
      if (!fs || !workerFs)
        return false;

      unmountUploadsIfNeeded();
      if (!fs.analyzePath('/uploads').exists)
        fs.mkdir('/uploads');

      fs.mount(workerFs, { files: [file] }, '/uploads');
      return true;
    }

    async function writePak(file) {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');

      const path = '/uploads/packed.pak';
      const size = typeof file.size === 'number' ? file.size : 0;
      const chunkSize = 4 * 1024 * 1024;
      let written = 0;

      // Stream the file into MEMFS in chunks to avoid locking the UI thread.
      const fd = fs.open(path, 'w+');
      try {
        while (written < size) {
          const end = Math.min(written + chunkSize, size);
          const buf = new Uint8Array(await file.slice(written, end).arrayBuffer());
          fs.write(fd, buf, 0, buf.length, written);
          written = end;
          const frac = size ? (written / size) : 1;
          setUploadProgress(frac);
          setStatus(`Uploading packed.pak... ${Math.floor(frac * 100)}% (${formatBytes(written)} / ${formatBytes(size)})`);
          await new Promise((resolve) => setTimeout(resolve, 0));
        }
      } finally {
        fs.close(fd);
      }
    }

    async function ensurePakAvailable(file) {
      const size = typeof file.size === 'number' ? file.size : 0;
      if (canUseWorkerFs()) {
        setStatus('Mounting packed.pak...');
        const mounted = mountPakWorkerFs(file);
        if (mounted) {
          setUploadProgress(1);
          setStatus(`Mounted packed.pak (${formatBytes(size)})`);
          return;
        }
      }
      setUploadProgress(0);
      setStatus('Uploading packed.pak...');
      await writePak(file);
    }

    function writeBootConfig() {
      const fs = getFs();
      if (!fs)
        throw new Error('Filesystem not ready yet.');
      const pthreadsAvailable = typeof PThread !== 'undefined' || (typeof Module !== 'undefined' && typeof Module.PThread !== 'undefined');
      const poolSize = (pthreadsAvailable && self.crossOriginIsolated) ? 4 : 0;
      const sbinit = {
        assetDirectories: ["/mods"],
        assetSources: ["/overrides", "/uploads/packed.pak"],
        storageDirectory: "/storage",
        logDirectory: "/storage/logs",
        logFileBackups: 1,
        includeUGC: false,
        assetsSettings: {
          workerPoolSize: poolSize
        },
        defaultConfiguration: {
          safe: {
            enableImGui: false
          }
        }
      };
      const json = JSON.stringify(sbinit, null, 2);
      fs.writeFile('/sbinit.config', json);
    }

    let runtimeReady = false;

    function wireUi() {
      const input = document.getElementById('pakInput');
      const modPakInput = document.getElementById('modPakInput');
      const modDirInput = document.getElementById('modDirInput');
      const refreshModsBtn = document.getElementById('refreshModsBtn');
      const clearModsBtn = document.getElementById('clearModsBtn');
      const startBtn = document.getElementById('startBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const canvas = document.getElementById('canvas');

      runtimeReady = true;
      let modUploadPending = false;

      const updateStartButton = () => {
        startBtn.disabled = !(runtimeReady && input.files && input.files.length > 0 && !modUploadPending);
      };

      waitForFsAvailable().then(updateStartButton).catch(() => {
        setStatus('Runtime ready. Waiting for filesystem...');
      });

      input.addEventListener('change', () => {
        updateStartButton();
      });

      // Fullscreen toggle
      if (fullscreenBtn) {
        fullscreenBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
              document.body.classList.add('fullscreen');
              resizeCanvasToDisplaySize();
              if (canvas) canvas.focus();
            }).catch((err) => {
              console.warn('[Web] Fullscreen request failed:', err);
            });
          } else {
            document.exitFullscreen().catch((err) => {
              console.warn('[Web] Exit fullscreen failed:', err);
            });
          }
        });

        document.addEventListener('fullscreenchange', () => {
          if (!document.fullscreenElement) {
            document.body.classList.remove('fullscreen');
          }
          resizeCanvasToDisplaySize();
        });
      }

      if (refreshModsBtn) {
        refreshModsBtn.addEventListener('click', async () => {
          try {
            await ensureFsReady();
            installFsSyncHooks();
            renderModsList();
          } catch (err) {
            console.error(err);
            setStatus('Failed to refresh mods: ' + err);
          }
        });
      }

      if (clearModsBtn) {
        clearModsBtn.addEventListener('click', async () => {
          if (!confirm('Delete ALL mods under /mods?'))
            return;
          try {
            await ensureFsReady();
            installFsSyncHooks();
            const fs = getFs();
            for (const name of listModsInFs())
              removeTree('/mods/' + name);
            scheduleSync('clearMods');
            renderModsList();
          } catch (err) {
            console.error(err);
            setStatus('Failed to delete mods: ' + err);
          }
        });
      }

      // Export save data
      const exportSaveBtn = document.getElementById('exportSaveBtn');
      if (exportSaveBtn) {
        exportSaveBtn.addEventListener('click', async () => {
          try {
            await ensureFsReady();
            setUploadProgress(0);
            await exportSaveData();
          } catch (err) {
            console.error(err);
            hideUploadProgress();
            setStatus('Export failed: ' + err.message);
            alert('Export failed: ' + err.message);
          }
        });
      }

      // Import save data
      const importSaveInput = document.getElementById('importSaveInput');
      if (importSaveInput) {
        importSaveInput.addEventListener('change', async () => {
          const file = importSaveInput.files && importSaveInput.files[0];
          if (!file)
            return;
          try {
            await ensureFsReady();
            installFsSyncHooks();
            setUploadProgress(0);
            await importSaveData(file);
          } catch (err) {
            console.error(err);
            hideUploadProgress();
            setStatus('Import failed: ' + err.message);
            alert('Import failed: ' + err.message);
          } finally {
            importSaveInput.value = '';
          }
        });
      }

      async function handleModPakFiles(fileList) {
        if (!fileList || fileList.length === 0)
          return;
        await ensureFsReady();
        installFsSyncHooks();
        let index = 0;
        for (const file of Array.from(fileList)) {
          index++;
          if (!file || !file.name)
            continue;
          const dest = '/mods/' + file.name;
          setUploadProgress(0);
          setStatus(`Installing mod ${index}/${fileList.length}: ${file.name}`);
          await writeFileFromBlob(dest, file, (written, total) => {
            const frac = total ? (written / total) : 1;
            setUploadProgress(frac);
          });
          hideUploadProgress();
          scheduleSync('installModPak');
        }
        hideUploadProgress();
        setStatus('Mods installed. Syncing storage...');
        renderModsList();
        // Keep Start disabled for 1.5s to allow IndexedDB sync
        modUploadPending = true;
        updateStartButton();
        setTimeout(() => {
          modUploadPending = false;
          updateStartButton();
          setStatus('Mods ready.');
        }, 1500);
      }

      async function handleModDirectoryFiles(fileList) {
        if (!fileList || fileList.length === 0)
          return;
        await ensureFsReady();
        installFsSyncHooks();

        const files = Array.from(fileList).filter((f) => f && (f.webkitRelativePath || f.name));
        // The browser provides relative paths like "MyMod/some/file.png".
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const rel = file.webkitRelativePath || file.name;
          const dest = '/mods/' + rel;
          setUploadProgress(0);
          setStatus(`Installing mod folder (${i + 1}/${files.length}): ${rel}`);
          await writeFileFromBlob(dest, file, (written, total) => {
            const frac = total ? (written / total) : 1;
            setUploadProgress(frac);
          });
          scheduleSync('installModFolder');
        }
        hideUploadProgress();
        setStatus('Mod folder installed. Syncing storage...');
        renderModsList();
        // Keep Start disabled for 1.5s to allow IndexedDB sync
        modUploadPending = true;
        updateStartButton();
        setTimeout(() => {
          modUploadPending = false;
          updateStartButton();
          setStatus('Mods ready.');
        }, 1500);
      }

      if (modPakInput) {
        modPakInput.addEventListener('change', async () => {
          try {
            await handleModPakFiles(modPakInput.files);
          } catch (err) {
            console.error(err);
            setStatus('Failed to install mod(s): ' + err);
          } finally {
            modPakInput.value = '';
          }
        });
      }

      if (modDirInput) {
        modDirInput.addEventListener('change', async () => {
          try {
            await handleModDirectoryFiles(modDirInput.files);
          } catch (err) {
            console.error(err);
            setStatus('Failed to install mod folder: ' + err);
          } finally {
            modDirInput.value = '';
          }
        });
      }

      if (canvas) {
        canvas.addEventListener('pointerdown', () => {
          canvas.focus();
        });
      }

      window.addEventListener('resize', () => {
        resizeCanvasToDisplaySize();
      });

      startBtn.addEventListener('click', async () => {
        if (!input.files || input.files.length === 0) {
          setStatus('Please select packed.pak');
          return;
        }
        try {
          console.info('[Web] Start clicked');
          setStatus('Preparing filesystem...');
          await ensureFsReady();
          installFsSyncHooks();
          renderModsList();
          await ensurePreloadConfig();
          hideUploadProgress();
          await ensurePakAvailable(input.files[0]);
          hideUploadProgress();
          setStatus('Writing config...');
          writeBootConfig();
          setStatus('Starting...');
          resizeCanvasToDisplaySize();
          if (canvas) canvas.focus();
          if (typeof Module.callMain !== 'function') {
            console.error('[Web] Module.callMain missing', Module);
            throw new Error('Runtime not ready (callMain unavailable).');
          }
          console.info('[Web] callMain()');
          try {
            const exitCode = Module.callMain([]);
            console.info('[Web] callMain() returned', exitCode);
          } catch (err) {
            console.error('[Web] callMain() threw', err);
            throw err;
          }
        } catch (err) {
          console.error(err);
          setStatus('Failed: ' + err);
        }
      });

      updateStartButton();
      setStatus('Ready. Select packed.pak, optionally install mods, then Start.');

      // Load persisted mods from IndexedDB on startup
      ensureFsReady().then(() => {
        renderModsList();
      }).catch((err) => {
        console.warn('[Web] Could not load persisted mods on startup:', err);
        renderModsList(); // Still render even if FS not ready - will show placeholder
      });
    }

    var Module = {
      preRun: [],
      postRun: [],
      noInitialRun: true,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      locateFile: (path, scriptDirectory) => {
        const basename = path.replace(/.*\//, '');
        if (scriptDirectory)
          return scriptDirectory + basename;
        return basename;
      },
      canvas: (() => document.getElementById('canvas'))(),
      onAbort: (reason) => {
        console.error('[Web] Abort:', reason);
        setStatus('Runtime aborted: ' + reason);
      },
      onExit: (code) => {
        console.info('[Web] Exit:', code);
      },
      onRuntimeInitialized: () => {
        console.info('[Web] Runtime initialized');
        resizeCanvasToDisplaySize();
        wireUi();
      },
    };

    window.addEventListener('error', (event) => {
      console.error('[Web] Window error:', event.message, event.error);
    });

    window.addEventListener('unhandledrejection', (event) => {
      console.error('[Web] Unhandled rejection:', event.reason);
    });
  </script>

  {{{ SCRIPT }}}
</body>
